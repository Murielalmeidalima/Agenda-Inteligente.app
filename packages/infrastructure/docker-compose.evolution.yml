version: '3.8'

services:
  # ==========================================
  # EVOLUTION API - Motor do WhatsApp
  # ==========================================
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://api.seudominio.com.br
      - CORS_ORIGIN=*
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      # Security
      - AUTHENTICATION_API_KEY=SUA_API_KEY_SUPER_SECRETA
      # Banco de dados
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:senha_forte@postgres:5432/evolution?schema=public
      # Redis
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/1
      # RabbitMQ (Opcional, false por padrão para simplicidade)
      - RABBITMQ_ENABLED=false
      # Webhooks globais
      - WEBHOOK_GLOBAL_URL=https://app.seudominio.com.br/api/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_EVENTS_CONTACTS_SET=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=true
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=true
      - WEBHOOK_EVENTS_CHATS_SET=true
      - WEBHOOK_EVENTS_CHATS_UPSERT=true
      - WEBHOOK_EVENTS_CHATS_UPDATE=true
      - WEBHOOK_EVENTS_CHATS_DELETE=true
      - WEBHOOK_EVENTS_GROUPS_UPSERT=true
      - WEBHOOK_EVENTS_GROUPS_UPDATE=true
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_LABELS_EDIT=true
      - WEBHOOK_EVENTS_LABELS_ASSOCIATION=true
      - WEBHOOK_EVENTS_CALL=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - redis
      - postgres
    networks:
      - evolution_network

  # ==========================================
  # REDIS - Cache de Sessões
  # ==========================================
  redis:
    image: redis:alpine
    container_name: evolution-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - evolution_network

  # ==========================================
  # POSTGRES - Persistência da Evolution
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha_forte
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_network

volumes:
  evolution_instances:
  evolution_store:
  redis_data:
  postgres_data:

networks:
  evolution_network:
    driver: bridge
